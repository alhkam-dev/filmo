spring:
  datasource:
    url: jdbc:mariadb://localhost:3308/films
    username: db
    password: db
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
  application:
    name: Filmo
  messages:
    basename: messages/messages
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

filmo:
  posters:
    upload-dir: ../../film-app-working-files/posters

film-api:
  base-url: "http://localhost:8085"
  client-id: "filmo-client"
  client-secret: "password-filmo"