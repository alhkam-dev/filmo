<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head th:replace="~{filmo/fragments/head :: header(title = 'Filmo - Artists creator')}"></head>

<body class="d-flex flex-column h-100 bg-light">

<nav th:replace="~{filmo/fragments/navbar :: navbar}"></nav>

<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <h1 class="fw-bold mb-4" th:text="#{artist.creation.heading}">Create artist</h1>
                <hr class="mb-4">

                <div class="alert alert-success" role="alert" th:if="${artistCreationSuccessMessage}">
                    <span th:text="#{artist.creation.success.message}">Artist created successfully!</span>
                </div>

                <div class="alert alert-danger" role="alert" th:if="${artistAlreadyExistsError}">
                    <span th:text="#{artist.creation.error.alreadyExists}">This artist already exists!</span>
                </div>

                <form th:action="@{/filmo/artists/artists-create}" th:object="${artistCreationDTO}" method="POST">

                    <div class="row mb-3 align-items-center">
                        <label for="name" class="col-sm-2 col-form-label required-label"
                               th:text="#{artist.creation.label.name}">Name</label>
                        <div class="col-sm-6">
                            <input type="text" id="name" th:field="*{name}" class="form-control">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}"></div>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="surname" class="col-sm-2 col-form-label required-label"
                               th:text="#{artist.creation.label.surname}">Surname</label>
                        <div class="col-sm-6">
                            <input type="text" id="surname" th:field="*{surname}" class="form-control">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('surname')}"
                                 th:errors="*{surname}"></div>
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <label for="type" class="col-sm-2 col-form-label"
                               th:text="#{artist.creation.label.type}">Type</label>
                        <div class="col-sm-6">
                            <select id="type" th:field="*{type}" class="form-select">
                                <option value="" th:text="#{artist.creation.label.defaultType}">Artist's type</option>
                                <option th:each="typeOpt : ${T(com.alhkam.film_web.domain.ArtistType).values()}"
                                        th:value="${typeOpt}"
                                        th:text="${typeOpt}">DIRECTOR
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 offset-sm-2">
                            <button type="submit" class="btn btn-primary px-4" th:text="#{artist.creation.btn.send}">
                                Send
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{filmo/fragments/footer :: footer}"></footer>

<script th:replace="~{filmo/fragments/scripts}"></script>

</body>
</html>
