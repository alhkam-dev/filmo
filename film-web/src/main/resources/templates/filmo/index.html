<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{filmo/fragments/head :: header(title = 'Filmo Web Application')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav th:replace="~{filmo/fragments/navbar :: navbar}"></nav>

<main class="container flex-grow-1 d-flex flex-column justify-content-center text-center">
    <div class="row py-5 justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <h1 class="border-bottom pb-2 d-inline-block" th:text="#{index.title}">Filmo - Web Application</h1>

            <p class="lead mt-4 text-secondary" th:text="#{index.welcome}">
                Welcome to the Filmo Web Application!
            </p>

            <div class="mt-4 row justify-content-center">
                <div class="col-10 col-sm-8 col-md-6 col-lg-5">
                    <img th:src="@{/images/absolute-cinema.png}"
                         class="img-fluid rounded shadow-sm" />
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{filmo/fragments/footer :: footer}"></footer>

<script th:replace="~{filmo/fragments/scripts}"></script>

</body>
</html>
